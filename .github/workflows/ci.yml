# =============================================================================
# CI — Lint, Type-Check, Build, Vitest, Playwright (alle Branches + PRs)
# -----------------------------------------------------------------------------
# Trigger-Logik:
#   • push    auf jede Branch        → CI läuft (auch auf main, parallel zu Deploy)
#   • pull_request gegen main/develop → CI läuft
#
# Bei PRs aus dem GLEICHEN Repo würde sowohl push als auch pull_request feuern.
# Die concurrency-Gruppe dedupliziert das: gleicher ref → laufender Job wird
# gecancelled und durch den neuen ersetzt.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ["**"]

concurrency:
  # Eindeutig pro Workflow + ref + event-quelle — verhindert Doppel-Runs
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-Privilege: CI liest nur den Code aus, schreibt nichts zurück.
permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # Checks the tree that actually ships, and fails on high or critical there.
  # Until 01.10.2026 nothing did: Next 16.3.3 with a critical advisory in
  # next/og, the function behind the Open Graph image, went live unnoticed.
  #
  # Production dependencies only. The dev tree carries findings from the lint
  # toolchain that have no upstream fix at times, and those must not hide a
  # real advisory in what the server runs.
  #
  # A job of its own, so a finding shows up under its own name instead of
  # stopping the build before the tests have said anything. It reads the
  # lockfile and needs no install.
  audit:
    name: Audit (production tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ignore-registry-errors: an outage of the audit endpoint is not a
      # vulnerability and should not turn the check red.
      - name: Audit
        run: pnpm audit --prod --audit-level=high --ignore-registry-errors

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm-Version kommt aus package.json -> "packageManager": "pnpm@x.y.z"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content (Frontmatter)
        run: pnpm run validate:content

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Test (Vitest)
        # `pnpm test` ist `vitest run` (einmalig, kein Watch-Mode). Kein
        # --passWithNoTests mehr: ein leerer Lauf soll auffallen, nicht durchgehen.
        run: pnpm test

      # Nur Chromium, und bewusst in diesem Job statt in einem eigenen: die
      # E2E-Tests laufen gegen den Produktions-Build, der hier eine Stufe weiter
      # oben ohnehin schon erzeugt wurde. Ein zweiter Job müsste ihn wiederholen.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (Playwright)
        # Startet `next start -p 3218` selbst, siehe webServer in
        # playwright.config.ts. Deckt Sprungmarken, Statuscodes, Sprachwechsel
        # und CSP-Verstöße ab, also alles, was nur an der laufenden Seite
        # sichtbar ist.
        run: pnpm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
